<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAMA BALL - Edición Premium</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c23;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            height: 100vh;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ui {
            background: #1d63ed;
            border-bottom: 4px solid #1444a4;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }
        .btn-ui:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn-ui.disabled {
            background: #2d303a;
            border-bottom-color: #1a1c23;
            opacity: 0.5;
            pointer-events: none;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
            justify-items: center;
        }

        .bottle {
            position: relative;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-top: none;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            width: 56px;
        }

        /* Tapa de la botella */
        .bottle-cap {
            position: absolute;
            top: -12px;
            left: -2px;
            right: -2px;
            height: 12px;
            background: #2d303a;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 6px 6px 0 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .bottle.completed .bottle-cap {
            opacity: 1;
        }

        .bottle.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.5);
        }

        .bottle.mini {
            width: 50px;
            border-radius: 18px;
            border-style: dashed;
        }

        /* Bolas Brillantes */
        .ball {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            margin-top: 2px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Gradiente brillante */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 20%),
                        radial-gradient(circle at 70% 70%, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 40%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .ball.floating {
            transform: translateY(-50px);
            z-index: 10;
        }

        /* Chispas de victoria */
        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 0.8s ease-out forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const COLORS = {
            red: '#ff4b4b',
            blue: '#2563eb',
            yellow: '#facc15',
            green: '#22c55e',
            purple: '#9333ea',
            orange: '#f97316',
            pink: '#db2777',
            cyan: '#06b6d4'
        };

        // Contexto de audio simple
        const playSound = (freq, type = 'sine', duration = 0.1) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        };

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [level, setLevel] = useState(1);
            const [tubes, setTubes] = useState([]);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [moves, setMoves] = useState(0);
            const [history, setHistory] = useState([]);
            const [bonusCount, setBonusCount] = useState(0);
            const [winStreak, setWinStreak] = useState(0);
            const [isWon, setIsWon] = useState(false);
            const [sparkles, setSparkles] = useState([]);

            const NORMAL_CAP = 4;

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 2000);
                return () => clearTimeout(timer);
            }, []);

            const initLevel = useCallback((lvl) => {
                const colorCount = Math.min(3 + Math.floor(lvl / 2), 8);
                const colorKeys = Object.keys(COLORS).slice(0, colorCount);
                
                let initial = colorKeys.map(color => Array(NORMAL_CAP).fill(color));
                initial.push([], []);

                // Mezclado
                for (let i = 0; i < 200; i++) {
                    const from = Math.floor(Math.random() * initial.length);
                    const to = Math.floor(Math.random() * initial.length);
                    if (from !== to && initial[from].length > 0 && initial[to].length < NORMAL_CAP) {
                        initial[to].push(initial[from].pop());
                    }
                }

                setTubes(initial.map((balls, id) => ({ 
                    id, 
                    balls, 
                    capacity: NORMAL_CAP,
                    isMini: false,
                    isCompleted: false
                })));
                setHistory([]);
                setMoves(0);
                setIsWon(false);
                setSelectedIdx(null);
                setSparkles([]);
            }, []);

            useEffect(() => {
                if (!showSplash) initLevel(level);
            }, [level, showSplash, initLevel]);

            const triggerSparkles = (x, y) => {
                const newSparkles = Array.from({ length: 8 }).map((_, i) => ({
                    id: Date.now() + i,
                    x: x + (Math.random() - 0.5) * 60,
                    y: y + (Math.random() - 0.5) * 60,
                    color: Object.values(COLORS)[Math.floor(Math.random() * 8)]
                }));
                setSparkles(prev => [...prev, ...newSparkles]);
                setTimeout(() => setSparkles(prev => prev.filter(s => !newSparkles.includes(s))), 800);
            };

            const handleTubeClick = (idx) => {
                if (isWon) return;

                if (selectedIdx === null) {
                    if (tubes[idx].balls.length > 0) {
                        setSelectedIdx(idx);
                        playSound(440, 'triangle');
                    }
                } else {
                    if (selectedIdx === idx) {
                        setSelectedIdx(null);
                        return;
                    }

                    const source = tubes[selectedIdx];
                    const target = tubes[idx];
                    
                    // LÓGICA DE MOVIMIENTO MÚLTIPLE
                    const topBallColor = source.balls[source.balls.length - 1];
                    
                    // Contar cuántas bolas del mismo color hay arriba
                    let ballsToMoveCount = 0;
                    for (let i = source.balls.length - 1; i >= 0; i--) {
                        if (source.balls[i] === topBallColor) ballsToMoveCount++;
                        else break;
                    }

                    const availableSpace = target.capacity - target.balls.length;
                    const canMoveAtLeastOne = availableSpace > 0 && 
                                             (target.balls.length === 0 || target.balls[target.balls.length - 1] === topBallColor);

                    if (canMoveAtLeastOne) {
                        const countToMove = Math.min(ballsToMoveCount, availableSpace);
                        
                        setHistory([...history, JSON.stringify(tubes)]);
                        const newTubes = [...tubes];
                        
                        // Mover las bolas
                        for(let i = 0; i < countToMove; i++) {
                            newTubes[idx].balls.push(newTubes[selectedIdx].balls.pop());
                        }

                        // Verificar si se completó la botella
                        if (newTubes[idx].balls.length === newTubes[idx].capacity && 
                            newTubes[idx].balls.every(b => b === newTubes[idx].balls[0])) {
                            newTubes[idx].isCompleted = true;
                            playSound(880, 'sine', 0.3);
                            triggerSparkles(window.innerWidth/2, window.innerHeight/2);
                        } else {
                            playSound(523.25, 'sine');
                        }

                        setTubes(newTubes);
                        setMoves(m => m + 1);
                        setSelectedIdx(null);
                        checkWin(newTubes);
                    } else {
                        setSelectedIdx(idx);
                        playSound(220, 'sawtooth', 0.05);
                    }
                }
            };

            const checkWin = (currentTubes) => {
                const win = currentTubes.every(t => 
                    t.balls.length === 0 || 
                    (t.balls.length === t.capacity && t.balls.every(b => b === t.balls[0]))
                );

                if (win) {
                    setIsWon(true);
                    playSound(659.25, 'sine', 0.2);
                    setTimeout(() => playSound(880, 'sine', 0.4), 200);
                    
                    const newStreak = winStreak + 1;
                    setWinStreak(newStreak);
                    if (newStreak % 5 === 0) setBonusCount(b => b + 1);
                    setTimeout(() => setLevel(l => l + 1), 2500);
                }
            };

            const useBonus = () => {
                if (bonusCount > 0) {
                    setBonusCount(b => b - 1);
                    setTubes([...tubes, { 
                        id: `mini-${Date.now()}`, 
                        balls: [], 
                        capacity: 1, 
                        isMini: true,
                        isCompleted: false
                    }]);
                    playSound(1000, 'square', 0.1);
                }
            };

            const undo = () => {
                if (history.length > 0) {
                    setTubes(JSON.parse(history[history.length - 1]));
                    setHistory(history.slice(0, -1));
                    setMoves(m => m - 1);
                    playSound(300, 'sine');
                }
            };

            if (showSplash) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-[#0a0a0c]">
                        <img src="mamaball.jpg" className="w-40 h-40 rounded-3xl mb-8 shadow-2xl" alt="Logo" />
                        <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-500 w-full origin-left animate-[loading_2s_linear]"></div>
                        </div>
                        <p className="mt-4 text-[10px] font-bold tracking-[0.4em] uppercase text-blue-400">Cargando Diversión...</p>
                        <style>{`@keyframes loading { from { transform: scaleX(0); } to { transform: scaleX(1); } }`}</style>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen overflow-hidden relative">
                    {/* Partículas de chispas */}
                    {sparkles.map(s => (
                        <div key={s.id} className="sparkle" style={{ left: s.x, top: s.y, backgroundColor: s.color }} />
                    ))}

                    <div className="p-4 flex flex-col items-center">
                        <div className="w-full max-w-md flex justify-between items-center mb-4">
                            <div className="flex gap-2">
                                <button onClick={() => { playSound(200); setLevel(1); }} className="btn-ui w-10 h-10">
                                    <svg className="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
                                </button>
                                <button onClick={() => { playSound(200); initLevel(level); }} className="btn-ui w-10 h-10">
                                    <svg className="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg>
                                </button>
                            </div>
                            
                            <div className="flex gap-2">
                                <button onClick={undo} className={`btn-ui px-3 ${history.length === 0 ? 'disabled' : ''}`}>
                                    <svg className="w-4 h-4 fill-white mr-1" viewBox="0 0 24 24"><path d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.13,8 12.5,8Z"/></svg>
                                    <span className="font-bold">{history.length}</span>
                                </button>
                                <button onClick={useBonus} className={`btn-ui px-3 ${bonusCount === 0 ? 'disabled' : ''}`}>
                                    <svg className="w-4 h-4 fill-white mr-1" viewBox="0 0 24 24"><path d="M19,2H5V5H19V2M17,6H7V8H17V6M19,9H5V22H19V9Z"/></svg>
                                    <span className="font-bold">{bonusCount}</span>
                                </button>
                            </div>
                        </div>

                        <div className="text-center">
                            <h1 className="text-2xl font-black italic tracking-tighter uppercase leading-none opacity-90">LEVEL {level}</h1>
                            <p className="text-[10px] font-bold text-blue-400 uppercase tracking-widest mt-1">Movimientos: {moves}</p>
                        </div>
                    </div>

                    <div className="flex-1 flex items-center justify-center p-2 overflow-y-auto">
                        <div className="game-grid">
                            {tubes.map((tube, idx) => (
                                <div 
                                    key={tube.id}
                                    className={`bottle ${selectedIdx === idx ? 'selected' : ''} ${tube.isMini ? 'mini' : ''} ${tube.isCompleted ? 'completed' : ''}`}
                                    style={{ height: tube.capacity === 1 ? '75px' : '190px' }}
                                    onClick={() => handleTubeClick(idx)}
                                >
                                    <div className="bottle-cap" />
                                    {tube.balls.map((color, bIdx) => (
                                        <div 
                                            key={bIdx}
                                            className={`ball ${selectedIdx === idx && bIdx === tube.balls.length - 1 ? 'floating' : ''}`}
                                            style={{ backgroundColor: COLORS[color] }}
                                        />
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="py-4 text-center border-t border-white/5 bg-black/40">
                        <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-400">
                            Racha: <span className="text-blue-500">{winStreak}</span> | MAMA BALL BY MEFDIM
                        </span>
                    </div>

                    {isWon && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-6 animate-fade">
                            <div className="bg-[#1a1c23] rounded-[2.5rem] p-10 text-center border-2 border-blue-500/30 shadow-2xl shadow-blue-500/10 w-full max-w-[300px]">
                                <div className="w-20 h-20 bg-gradient-to-tr from-green-500 to-emerald-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-green-500/30 animate-bounce">
                                    <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" strokeWidth="4" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <h2 className="text-3xl font-black italic uppercase text-white tracking-tighter">¡EXCELENTE!</h2>
                                <p className="text-blue-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-2">Nivel {level} Completado</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
