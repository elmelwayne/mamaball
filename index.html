<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAMA BALL - Edición Optimizada</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c23;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            height: 100vh;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ui {
            background: #1d63ed;
            border-bottom: 4px solid #1444a4;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }
        .btn-ui:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn-ui.disabled {
            background: #2d303a;
            border-bottom-color: #1a1c23;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Contenedor de botellas optimizado para aprovechar ancho */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
            justify-items: center;
        }

        .bottle {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            border-top: none;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            width: 54px;
        }

        .bottle.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .bottle.mini {
            width: 48px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-style: dashed; /* Para diferenciarlas */
        }

        .ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-top: 2px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.3), 
                        inset 4px 4px 8px rgba(255,255,255,0.2);
        }

        .ball.floating {
            transform: translateY(-45px);
            z-index: 10;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const COLORS = {
            red: '#ff4b4b',
            blue: '#2563eb',
            yellow: '#facc15',
            green: '#22c55e',
            purple: '#9333ea',
            orange: '#f97316',
            pink: '#db2777',
            cyan: '#06b6d4'
        };

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [level, setLevel] = useState(1);
            const [tubes, setTubes] = useState([]);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [moves, setMoves] = useState(0);
            const [history, setHistory] = useState([]);
            const [bonusCount, setBonusCount] = useState(0);
            const [winStreak, setWinStreak] = useState(0);
            const [isWon, setIsWon] = useState(false);

            const NORMAL_CAP = 4;

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 2000);
                return () => clearTimeout(timer);
            }, []);

            const initLevel = useCallback((lvl) => {
                const colorCount = Math.min(3 + Math.floor(lvl / 2), 8);
                const colorKeys = Object.keys(COLORS).slice(0, colorCount);
                
                let initial = colorKeys.map(color => Array(NORMAL_CAP).fill(color));
                initial.push([], []); // 2 vacíos iniciales

                // Mezclado lógico
                for (let i = 0; i < 150; i++) {
                    const from = Math.floor(Math.random() * initial.length);
                    const to = Math.floor(Math.random() * initial.length);
                    if (from !== to && initial[from].length > 0 && initial[to].length < NORMAL_CAP) {
                        initial[to].push(initial[from].pop());
                    }
                }

                setTubes(initial.map((balls, id) => ({ 
                    id, 
                    balls, 
                    capacity: NORMAL_CAP,
                    isMini: false 
                })));
                setHistory([]);
                setMoves(0);
                setIsWon(false);
                setSelectedIdx(null);
            }, []);

            useEffect(() => {
                if (!showSplash) initLevel(level);
            }, [level, showSplash, initLevel]);

            const handleTubeClick = (idx) => {
                if (isWon) return;

                if (selectedIdx === null) {
                    if (tubes[idx].balls.length > 0) setSelectedIdx(idx);
                } else {
                    if (selectedIdx === idx) {
                        setSelectedIdx(null);
                        return;
                    }

                    const source = tubes[selectedIdx];
                    const target = tubes[idx];
                    const ball = source.balls[source.balls.length - 1];

                    const canMove = target.balls.length < target.capacity && 
                                    (target.balls.length === 0 || target.balls[target.balls.length - 1] === ball);

                    if (canMove) {
                        setHistory([...history, JSON.stringify(tubes)]);
                        const newTubes = [...tubes];
                        newTubes[idx].balls.push(newTubes[selectedIdx].balls.pop());
                        setTubes(newTubes);
                        setMoves(m => m + 1);
                        setSelectedIdx(null);
                        checkWin(newTubes);
                    } else {
                        setSelectedIdx(idx);
                    }
                }
            };

            const checkWin = (currentTubes) => {
                const win = currentTubes.every(t => 
                    t.balls.length === 0 || 
                    (t.balls.length === t.capacity && t.balls.every(b => b === t.balls[0]))
                );

                if (win) {
                    setIsWon(true);
                    const newStreak = winStreak + 1;
                    setWinStreak(newStreak);
                    if (newStreak % 5 === 0) setBonusCount(b => b + 1);
                    setTimeout(() => setLevel(l => l + 1), 2000);
                }
            };

            const useBonus = () => {
                if (bonusCount > 0) {
                    setBonusCount(b => b - 1);
                    setTubes([...tubes, { 
                        id: `mini-${Date.now()}`, 
                        balls: [], 
                        capacity: 1, 
                        isMini: true 
                    }]);
                }
            };

            const undo = () => {
                if (history.length > 0) {
                    setTubes(JSON.parse(history[history.length - 1]));
                    setHistory(history.slice(0, -1));
                    setMoves(m => m - 1);
                }
            };

            if (showSplash) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-[#0a0a0c]">
                        <img src="mamaball.jpg" className="w-40 h-40 rounded-3xl mb-8 shadow-2xl" alt="Logo" />
                        <div className="w-48 h-1.5 bg-white/10 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-500 w-full origin-left animate-[loading_2s_linear]"></div>
                        </div>
                        <p className="mt-4 text-[10px] font-bold tracking-[0.4em] uppercase text-blue-400">Cargando...</p>
                        <style>{`@keyframes loading { from { transform: scaleX(0); } to { transform: scaleX(1); } }`}</style>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* Header Compacto */}
                    <div className="p-4 flex flex-col items-center">
                        <div className="w-full max-w-md flex justify-between items-center mb-4">
                            <div className="flex gap-2">
                                <button onClick={() => setLevel(1)} className="btn-ui w-10 h-10">
                                    <svg className="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
                                </button>
                                <button onClick={() => initLevel(level)} className="btn-ui w-10 h-10">
                                    <svg className="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg>
                                </button>
                            </div>
                            
                            <div className="flex gap-2">
                                <button onClick={undo} className={`btn-ui px-3 ${history.length === 0 ? 'disabled' : ''}`}>
                                    <svg className="w-4 h-4 fill-white mr-1" viewBox="0 0 24 24"><path d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.13,8 12.5,8Z"/></svg>
                                    <span className="font-bold">{history.length}</span>
                                </button>
                                <button onClick={useBonus} className={`btn-ui px-3 ${bonusCount === 0 ? 'disabled' : ''}`}>
                                    <svg className="w-4 h-4 fill-white mr-1" viewBox="0 0 24 24"><path d="M19,2H5V5H19V2M17,6H7V8H17V6M19,9H5V22H19V9Z"/></svg>
                                    <span className="font-bold">{bonusCount}</span>
                                </button>
                            </div>
                        </div>

                        {/* Texto de nivel ajustado */}
                        <div className="text-center">
                            <h1 className="text-3xl font-black italic tracking-tighter uppercase leading-none">LEVEL {level}</h1>
                            <p className="text-[9px] font-bold text-blue-500/60 uppercase tracking-widest mt-1">Movimientos: {moves}</p>
                        </div>
                    </div>

                    {/* Área de Juego - Grid Dinámica */}
                    <div className="flex-1 flex items-center justify-center p-2 overflow-y-auto">
                        <div className="game-grid">
                            {tubes.map((tube, idx) => (
                                <div 
                                    key={tube.id}
                                    className={`bottle ${selectedIdx === idx ? 'selected' : ''} ${tube.isMini ? 'mini' : ''}`}
                                    style={{ height: tube.capacity === 1 ? '70px' : '185px' }}
                                    onClick={() => handleTubeClick(idx)}
                                >
                                    {tube.balls.map((color, bIdx) => (
                                        <div 
                                            key={bIdx}
                                            className={`ball ${selectedIdx === idx && bIdx === tube.balls.length - 1 ? 'floating' : ''}`}
                                            style={{ backgroundColor: COLORS[color] }}
                                        />
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Footer con Racha */}
                    <div className="py-4 text-center border-t border-white/5 bg-black/20">
                        <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500">
                            Racha: <span className="text-blue-500">{winStreak}</span> | MAMA BALL BY MEFDIM
                        </span>
                    </div>

                    {/* Modal Victoria */}
                    {isWon && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 animate-fade">
                            <div className="bg-[#1f2937] rounded-[2rem] p-8 text-center border-2 border-white/10 shadow-2xl w-full max-w-[280px]">
                                <div className="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-green-500/20">
                                    <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" strokeWidth="4" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <h2 className="text-2xl font-black italic uppercase text-white">¡GENIAL!</h2>
                                <p className="text-gray-400 text-[10px] font-bold uppercase mt-1">Preparando siguiente nivel...</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
