<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAMA BALL - Clasificador de Bolas</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #171717;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Chispas de victoria */
        @keyframes spark {
            0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(0); opacity: 0; }
        }
        .animate-spark {
            animation: spark 0.7s cubic-bezier(0.1, 0.5, 0.2, 1) var(--delay) forwards;
        }

        /* Animación de la tapa del tubo */
        @keyframes capSeal {
            0% { transform: translate(-50%, -40px) scaleY(1.5); opacity: 0; }
            60% { transform: translate(-50%, 5px) scaleY(0.8); opacity: 1; }
            100% { transform: translate(-50%, 0) scaleY(1); opacity: 1; }
        }
        .animate-cap {
            animation: capSeal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Estilo de las bolas */
        .ball {
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 9999px;
            position: absolute;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            background: radial-gradient(circle at 30% 30%, #ffffff 2%, var(--ball-base) 40%, var(--ball-dark) 100%);
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
            bottom: calc(var(--ball-index) * 2.3rem + 0.2rem);
            left: 50%;
            transform: translateX(-50%);
        }

        .ball.selected {
            transform: translateX(-50%) translateY(-3.5rem) scale(1.1);
        }

        /* Pantalla de carga */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        @media (min-width: 640px) {
            .ball {
                width: 3rem;
                height: 3rem;
                bottom: calc(var(--ball-index) * 3.1rem + 0.3rem);
            }
            .ball.selected {
                transform: translateX(-50%) translateY(-5rem) scale(1.1);
            }
        }

        /* Barra de carga victoria */
        @keyframes loadingBar {
            from { width: 0%; }
            to { width: 100%; }
        }
        .animate-loading-bar {
            animation: loadingBar 3s linear forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BALL_COLORS = {
            red: { base: '#ff4b4b', dark: '#8b0000' },
            blue: { base: '#00bfff', dark: '#00008b' },
            yellow: { base: '#ffd700', dark: '#b8860b' },
            green: { base: '#32cd32', dark: '#006400' },
            purple: { base: '#9370db', dark: '#4b0082' },
            orange: { base: '#ff8c00', dark: '#8b4500' },
            pink: { base: '#ff69b4', dark: '#8b0a50' },
            cyan: { base: '#00ffff', dark: '#008b8b' },
        };

        const getLevelConfig = (lvl) => {
            const colors = Math.min(2 + Math.floor((lvl - 1) / 2), 8);
            const empty = lvl > 5 ? 2 : (lvl > 2 ? 2 : 1);
            return { colors, empty };
        };

        const TUBE_CAPACITY = 4;

        // Audio Context para sonidos sintetizados
        let audioCtx = null;
        
        const initAudio = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        };

        const playSound = (type) => {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start();
                osc.stop(now + 0.1);
            } else if (type === 'complete') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start();
                osc.stop(now + 0.4);
            } else if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(329.63, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.4);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start();
                osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine';
                [523, 659, 783, 1046].forEach((f, i) => {
                    osc.frequency.setValueAtTime(f, now + i * 0.1);
                });
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.start();
                osc.stop(now + 0.8);
            }
        };

        const Sparks = ({ color }) => (
            <div className="absolute inset-0 pointer-events-none overflow-visible z-50">
                {[...Array(16)].map((_, i) => (
                    <div
                        key={i}
                        className="absolute left-1/2 top-0 w-1.5 h-1.5 rounded-full animate-spark"
                        style={{
                            backgroundColor: color,
                            '--angle': `${i * 22.5}deg`,
                            '--delay': `${Math.random() * 0.1}s`,
                            '--dist': `${60 + Math.random() * 40}px`,
                            boxShadow: `0 0 8px ${color}, 0 0 12px white`
                        }}
                    />
                ))}
            </div>
        );

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [tubes, setTubes] = useState([]);
            const [selectedTube, setSelectedTube] = useState(null);
            const [level, setLevel] = useState(1);
            const [moves, setMoves] = useState(0);
            const [isWon, setIsWon] = useState(false);
            const [completedTubes, setCompletedTubes] = useState([]);

            // Manejo de la Splash Screen
            useEffect(() => {
                const timer = setTimeout(() => {
                    setShowSplash(false);
                    initAudio();
                    playSound('start');
                }, 3500); // 3.5 segundos para ver bien la imagen
                return () => clearTimeout(timer);
            }, []);

            // Salto automático de nivel
            useEffect(() => {
                if (isWon) {
                    const timer = setTimeout(() => {
                        setLevel(prev => prev + 1);
                    }, 3000);
                    return () => clearTimeout(timer);
                }
            }, [isWon]);

            const generateLevel = (levelIndex) => {
                const config = getLevelConfig(levelIndex);
                const availableColors = Object.keys(BALL_COLORS).slice(0, config.colors);
                let currentTubes = [];
                for (let i = 0; i < config.colors; i++) {
                    currentTubes.push(Array(TUBE_CAPACITY).fill(availableColors[i]));
                }
                for (let i = 0; i < config.empty; i++) {
                    currentTubes.push([]);
                }

                // Mezclado lógico
                for (let i = 0; i < 200; i++) {
                    const sources = currentTubes.map((t, idx) => t.length > 0 ? idx : -1).filter(idx => idx !== -1);
                    const sourceIdx = sources[Math.floor(Math.random() * sources.length)];
                    const targets = currentTubes.map((t, idx) => (t.length < TUBE_CAPACITY && idx !== sourceIdx) ? idx : -1).filter(idx => idx !== -1);
                    if (targets.length === 0) continue;
                    const targetIdx = targets[Math.floor(Math.random() * targets.length)];
                    currentTubes[targetIdx].push(currentTubes[sourceIdx].pop());
                }
                return currentTubes;
            };

            const startLevel = (lvl) => {
                setTubes(generateLevel(lvl));
                setSelectedTube(null);
                setMoves(0);
                setIsWon(false);
                setCompletedTubes([]);
            };

            useEffect(() => { 
                if (!showSplash) startLevel(level); 
            }, [level, showSplash]);

            const handleTubeClick = (tubeIndex) => {
                if (isWon || completedTubes.includes(tubeIndex)) return;
                initAudio();
                
                if (selectedTube === null) {
                    if (tubes[tubeIndex].length > 0) setSelectedTube(tubeIndex);
                } else {
                    if (selectedTube === tubeIndex) { setSelectedTube(null); return; }
                    
                    const source = tubes[selectedTube];
                    const target = tubes[tubeIndex];
                    
                    if (target.length >= TUBE_CAPACITY) {
                        setSelectedTube(tubeIndex);
                        return;
                    }

                    const movingBallColor = source[source.length - 1];

                    if (target.length === 0 || target[target.length - 1] === movingBallColor) {
                        // Movimiento en bloque (misma lógica que antes)
                        let ballsToMoveCount = 0;
                        for (let i = source.length - 1; i >= 0; i--) {
                            if (source[i] === movingBallColor && (target.length + ballsToMoveCount) < TUBE_CAPACITY) {
                                ballsToMoveCount++;
                            } else {
                                break;
                            }
                        }

                        if (ballsToMoveCount > 0) {
                            const newTubes = [...tubes];
                            const newSource = [...source];
                            const newTarget = [...target];

                            for (let i = 0; i < ballsToMoveCount; i++) {
                                newTarget.push(newSource.pop());
                            }

                            newTubes[selectedTube] = newSource;
                            newTubes[tubeIndex] = newTarget;

                            if (newTarget.length === TUBE_CAPACITY && newTarget.every(b => b === movingBallColor)) {
                                setCompletedTubes(prev => [...prev, tubeIndex]);
                                playSound('complete');
                            } else {
                                playSound('move');
                            }

                            setTubes(newTubes);
                            setMoves(m => m + 1);
                            setSelectedTube(null);

                            if (newTubes.every(t => t.length === 0 || (t.length === TUBE_CAPACITY && t.every(b => b === t[0])))) {
                                setIsWon(true);
                                playSound('win');
                            }
                        }
                    } else {
                        setSelectedTube(tubeIndex);
                    }
                }
            };

            if (showSplash) {
                return (
                    <div className="splash-screen">
                        {/* IMPORTANTE: La imagen debe estar en el mismo lugar que el index.html en GitHub.
                          Se añade un borde blanco para que se note si está cargando.
                        */}
                        <div className="relative w-72 h-72 sm:w-96 sm:h-96 flex items-center justify-center bg-neutral-900 rounded-3xl border-4 border-white/10 overflow-hidden shadow-2xl">
                            <img 
                                src="mamaball.jpg" 
                                alt="MAMA BALL" 
                                className="w-full h-full object-cover animate-pulse"
                                onError={(e) => {
                                    e.target.onerror = null; 
                                    // Si falla la local, intenta un placeholder o informa
                                    console.log("Error cargando mamaball.jpg local");
                                }}
                            />
                        </div>
                        <div className="mt-10 flex flex-col items-center">
                            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                            <p className="mt-4 text-white font-bold tracking-widest text-sm uppercase animate-pulse">Cargando Diversión...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen w-full bg-neutral-900 text-white flex flex-col items-center select-none overflow-hidden">
                    {/* Header */}
                    <div className="w-full max-w-2xl flex justify-between items-center py-6 px-8 sm:px-12">
                        <div>
                            <h1 className="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 italic">MAMA BALL</h1>
                            <p className="text-[10px] sm:text-xs text-neutral-500 uppercase font-bold tracking-widest">Nivel Actual: {level}</p>
                        </div>
                        <div className="text-right">
                            <p className="text-[10px] text-neutral-500 uppercase font-black">Movimientos</p>
                            <p className="text-xl sm:text-2xl font-mono font-bold leading-none">{moves}</p>
                        </div>
                    </div>

                    {/* Tablero */}
                    <div className="flex-1 w-full flex items-center justify-center p-4">
                        <div className="grid grid-cols-4 sm:grid-cols-5 gap-x-6 gap-y-16 items-end">
                            {tubes.map((tube, tubeIndex) => (
                                <div key={tubeIndex} className="relative cursor-pointer" onClick={() => handleTubeClick(tubeIndex)}>
                                    <div className={`relative w-12 sm:w-16 h-44 sm:h-60 border-x-4 border-b-4 rounded-b-3xl transition-all duration-300
                                        ${selectedTube === tubeIndex ? 'border-blue-400 bg-white/10 scale-105 shadow-[0_0_20px_rgba(96,165,250,0.3)]' : 'border-white/20 bg-white/5'}
                                        ${completedTubes.includes(tubeIndex) ? 'border-green-500/40 bg-green-500/10' : ''}
                                    `}>
                                        {completedTubes.includes(tubeIndex) && <Sparks color={BALL_COLORS[tube[0]].base} />}
                                        {completedTubes.includes(tubeIndex) && (
                                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-[115%] h-5 z-40 animate-cap">
                                                <div className="w-full h-full bg-neutral-400 rounded-t-lg shadow-md border-b border-black/20"></div>
                                            </div>
                                        )}
                                        <div className="relative w-full h-full">
                                            {tube.map((color, bIdx) => (
                                                <div key={bIdx} className={`ball ${selectedTube === tubeIndex && bIdx === tube.length - 1 ? 'selected' : ''}`}
                                                    style={{ '--ball-index': bIdx, '--ball-base': BALL_COLORS[color].base, '--ball-dark': BALL_COLORS[color].dark }}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Footer / Botón Reiniciar */}
                    <div className="py-8">
                        <button 
                            onClick={() => startLevel(level)} 
                            className="px-8 py-3 rounded-xl bg-white/5 border border-white/10 text-xs font-bold hover:bg-white/10 active:scale-95 transition-all uppercase tracking-widest text-neutral-400 hover:text-white"
                        >
                            Reiniciar Nivel
                        </button>
                    </div>

                    {/* Modal de Victoria con cambio automático */}
                    {isWon && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-6 backdrop-blur-sm">
                            <div className="bg-neutral-800 p-8 sm:p-12 rounded-[2.5rem] text-center shadow-2xl max-w-sm w-full border border-white/10 relative overflow-hidden">
                                <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <svg className="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>
                                <h2 className="text-4xl font-black mb-2 italic text-white">¡EXCELENTE!</h2>
                                <p className="text-neutral-400 text-sm mb-6 uppercase tracking-widest font-bold">Nivel {level} Completado</p>
                                
                                <div className="space-y-4">
                                    <p className="text-blue-400 text-xs font-black animate-pulse uppercase">Cargando siguiente nivel...</p>
                                    <div className="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
                                        <div className="h-full bg-blue-500 animate-loading-bar"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
