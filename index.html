<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAMA BALL - Billar Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1115;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            height: 100vh;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ui {
            background: #1d63ed;
            border-bottom: 4px solid #1444a4;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }
        .btn-ui:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn-ui.disabled {
            background: #2d303a;
            border-bottom-color: #1a1c23;
            opacity: 0.5;
            pointer-events: none;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
            justify-items: center;
        }

        .bottle {
            position: relative;
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.12);
            border-top: none;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            width: 54px;
        }

        .bottle-cap {
            position: absolute;
            top: -12px;
            left: -2px;
            right: -2px;
            height: 12px;
            background: #374151;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 6px 6px 0 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .bottle.completed .bottle-cap {
            opacity: 1;
        }

        .bottle.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .bottle.mini {
            width: 48px;
            border-radius: 18px;
            border-style: dashed;
        }

        .ball {
            border-radius: 50%;
            margin-top: 1px;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 25%),
                        radial-gradient(circle at 65% 65%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 45%);
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .ball.floating {
            transform: translateY(-55px);
            z-index: 20;
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 0.7s ease-out forwards;
            pointer-events: none;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .win-anim { animation: winPulse 0.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const COLORS = {
            red: '#ff3b3b',
            blue: '#1d4ed8',
            yellow: '#eab308',
            green: '#15803d',
            purple: '#7e22ce',
            orange: '#ea580c',
            pink: '#be185d',
            cyan: '#0891b2'
        };

        // Sonido de billar mejorado (síntesis física de impacto)
        const playBilliardSound = () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const noise = ctx.createBufferSource();
            
            // Sonido base (tonal)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
            
            // Ruido de impacto (ataque)
            const bufferSize = ctx.sampleRate * 0.02;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

            osc.connect(gain);
            noise.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            noise.start();
            osc.stop(ctx.currentTime + 0.1);
        };

        const playWinSound = () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + i * 0.1);
                osc.stop(ctx.currentTime + i * 0.1 + 0.3);
            });
        };

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [level, setLevel] = useState(1);
            const [tubes, setTubes] = useState([]);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [moves, setMoves] = useState(0);
            const [history, setHistory] = useState([]);
            const [bonusCount, setBonusCount] = useState(0);
            const [winStreak, setWinStreak] = useState(0);
            const [isWon, setIsWon] = useState(false);
            const [sparkles, setSparkles] = useState([]);

            // Cargar datos guardados
            useEffect(() => {
                const savedData = localStorage.getItem('mamaball_save');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    setLevel(data.level || 1);
                    setWinStreak(data.winStreak || 0);
                    setBonusCount(data.bonusCount || 0);
                }
                const timer = setTimeout(() => setShowSplash(false), 2000);
                return () => clearTimeout(timer);
            }, []);

            // Guardar datos cada vez que cambien valores clave
            useEffect(() => {
                if (!showSplash) {
                    localStorage.setItem('mamaball_save', JSON.stringify({
                        level, winStreak, bonusCount
                    }));
                }
            }, [level, winStreak, bonusCount, showSplash]);

            const initLevel = useCallback((lvl) => {
                // Lógica de dificultad basada en nivel
                let capacity = 4;
                if (lvl >= 20) capacity = 6;
                else if (lvl >= 10) capacity = 5;

                const colorCount = Math.min(3 + Math.floor(lvl / 2), 8);
                const colorKeys = Object.keys(COLORS).slice(0, colorCount);
                
                let initial = colorKeys.map(color => Array(capacity).fill(color));
                initial.push([], []);

                // Mezclado intenso
                for (let i = 0; i < 300; i++) {
                    const from = Math.floor(Math.random() * initial.length);
                    const to = Math.floor(Math.random() * initial.length);
                    if (from !== to && initial[from].length > 0 && initial[to].length < capacity) {
                        initial[to].push(initial[from].pop());
                    }
                }

                setTubes(initial.map((balls, id) => ({ 
                    id: `${lvl}-${id}`, 
                    balls, 
                    capacity,
                    isMini: false,
                    isCompleted: false
                })));
                setHistory([]);
                setMoves(0);
                setIsWon(false);
                setSelectedIdx(null);
                setSparkles([]);
            }, []);

            useEffect(() => {
                if (!showSplash) initLevel(level);
            }, [level, showSplash, initLevel]);

            const triggerSparkles = (x, y) => {
                const newSparkles = Array.from({ length: 12 }).map((_, i) => ({
                    id: Math.random(),
                    x: x + (Math.random() - 0.5) * 100,
                    y: y + (Math.random() - 0.5) * 100,
                    color: Object.values(COLORS)[Math.floor(Math.random() * 8)]
                }));
                setSparkles(prev => [...prev, ...newSparkles]);
                setTimeout(() => setSparkles(prev => prev.filter(s => !newSparkles.includes(s))), 700);
            };

            const handleTubeClick = (idx) => {
                if (isWon) return;

                if (selectedIdx === null) {
                    if (tubes[idx].balls.length > 0) {
                        setSelectedIdx(idx);
                        playBilliardSound();
                    }
                } else {
                    if (selectedIdx === idx) {
                        setSelectedIdx(null);
                        return;
                    }

                    const source = tubes[selectedIdx];
                    const target = tubes[idx];
                    const colorToMove = source.balls[source.balls.length - 1];
                    
                    let sameColorCount = 0;
                    for (let i = source.balls.length - 1; i >= 0; i--) {
                        if (source.balls[i] === colorToMove) sameColorCount++;
                        else break;
                    }

                    const space = target.capacity - target.balls.length;
                    const validColor = target.balls.length === 0 || target.balls[target.balls.length - 1] === colorToMove;

                    if (space > 0 && validColor) {
                        const toMove = Math.min(sameColorCount, space);
                        setHistory([...history, JSON.stringify(tubes)]);
                        const newTubes = [...tubes];
                        
                        for(let i = 0; i < toMove; i++) {
                            newTubes[idx].balls.push(newTubes[selectedIdx].balls.pop());
                        }

                        playBilliardSound();

                        if (newTubes[idx].balls.length === newTubes[idx].capacity && 
                            newTubes[idx].balls.every(b => b === newTubes[idx].balls[0])) {
                            newTubes[idx].isCompleted = true;
                            triggerSparkles(window.innerWidth/2, window.innerHeight/2);
                        }

                        setTubes(newTubes);
                        setMoves(m => m + 1);
                        setSelectedIdx(null);
                        
                        // Verificar victoria
                        const win = newTubes.every(t => 
                            t.balls.length === 0 || (t.balls.length === t.capacity && t.balls.every(b => b === t.balls[0]))
                        );
                        if (win) {
                            setIsWon(true);
                            playWinSound();
                            setWinStreak(s => {
                                const next = s + 1;
                                if (next % 5 === 0) setBonusCount(b => b + 1);
                                return next;
                            });
                            setTimeout(() => setLevel(l => l + 1), 2500);
                        }
                    } else {
                        setSelectedIdx(idx);
                        playBilliardSound();
                    }
                }
            };

            const addBonusTube = () => {
                if (bonusCount > 0) {
                    setBonusCount(b => b - 1);
                    setTubes([...tubes, { 
                        id: `bonus-${Date.now()}`, 
                        balls: [], 
                        capacity: 1, 
                        isMini: true,
                        isCompleted: false
                    }]);
                    playBilliardSound();
                }
            };

            const undo = () => {
                if (history.length > 0) {
                    setTubes(JSON.parse(history[history.length - 1]));
                    setHistory(history.slice(0, -1));
                    setMoves(m => m - 1);
                    playBilliardSound();
                }
            };

            if (showSplash) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-[#050505]">
                        <img src="mamaball.jpg" className="w-40 h-40 rounded-[2rem] mb-8 shadow-[0_0_50px_rgba(29,99,237,0.2)]" alt="Logo" />
                        <div className="w-48 h-1 bg-white/5 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-500 w-full origin-left animate-[loading_2s_linear]"></div>
                        </div>
                        <p className="mt-4 text-[10px] font-black tracking-[0.5em] uppercase text-blue-500/80">Recuperando Progreso</p>
                        <style>{`@keyframes loading { from { transform: scaleX(0); } to { transform: scaleX(1); } }`}</style>
                    </div>
                );
            }

            // Cálculo dinámico de tamaño de bola según capacidad
            const currentCap = tubes[0]?.capacity || 4;
            const ballSize = currentCap > 5 ? '32px' : currentCap > 4 ? '36px' : '42px';
            const tubeHeight = currentCap > 5 ? '210px' : currentCap > 4 ? '195px' : '185px';

            return (
                <div className="flex flex-col h-screen overflow-hidden relative">
                    {sparkles.map(s => (
                        <div key={s.id} className="sparkle" style={{ left: s.x, top: s.y, backgroundColor: s.color }} />
                    ))}

                    {/* Navbar */}
                    <div className="p-4 flex flex-col items-center">
                        <div className="w-full max-w-md flex justify-between items-center mb-4">
                            <div className="flex gap-2">
                                <button onClick={() => { localStorage.clear(); location.reload(); }} className="btn-ui w-10 h-10">
                                    <svg className="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
                                </button>
                                <button onClick={() => initLevel(level)} className="btn-ui w-10 h-10">
                                    <svg className="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg>
                                </button>
                            </div>
                            
                            <div className="flex gap-2">
                                <button onClick={undo} className={`btn-ui px-3 ${history.length === 0 ? 'disabled' : ''}`}>
                                    <svg className="w-4 h-4 fill-white mr-1" viewBox="0 0 24 24"><path d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.13,8 12.5,8Z"/></svg>
                                    <span className="font-bold">{history.length}</span>
                                </button>
                                <button onClick={addBonusTube} className={`btn-ui px-3 ${bonusCount === 0 ? 'disabled' : ''}`}>
                                    <svg className="w-4 h-4 fill-white mr-1" viewBox="0 0 24 24"><path d="M19,2H5V5H19V2M17,6H7V8H17V6M19,9H5V22H19V9Z"/></svg>
                                    <span className="font-bold">{bonusCount}</span>
                                </button>
                            </div>
                        </div>

                        <div className="text-center">
                            <h1 className="text-xl font-black italic tracking-[0.2em] uppercase text-white/90">LEVEL {level}</h1>
                            <div className="flex gap-4 mt-1">
                                <span className="text-[9px] font-bold text-blue-400 uppercase">Mvs: {moves}</span>
                                <span className="text-[9px] font-bold text-amber-500 uppercase">Cap: {currentCap}</span>
                            </div>
                        </div>
                    </div>

                    {/* Tablero */}
                    <div className="flex-1 flex items-center justify-center p-2 overflow-y-auto">
                        <div className="game-grid">
                            {tubes.map((tube, idx) => (
                                <div 
                                    key={tube.id}
                                    className={`bottle ${selectedIdx === idx ? 'selected' : ''} ${tube.isMini ? 'mini' : ''} ${tube.isCompleted ? 'completed' : ''}`}
                                    style={{ height: tube.capacity === 1 ? '70px' : tubeHeight }}
                                    onClick={() => handleTubeClick(idx)}
                                >
                                    <div className="bottle-cap" />
                                    {tube.balls.map((color, bIdx) => (
                                        <div 
                                            key={bIdx}
                                            className={`ball ${selectedIdx === idx && bIdx === tube.balls.length - 1 ? 'floating' : ''}`}
                                            style={{ 
                                                backgroundColor: COLORS[color],
                                                width: ballSize,
                                                height: ballSize
                                            }}
                                        />
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="py-4 text-center border-t border-white/5 bg-black/40">
                        <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500">
                            Racha: <span className="text-blue-500">{winStreak}</span> | MAMA BALL Billar
                        </span>
                    </div>

                    {/* Pantalla Victoria */}
                    {isWon && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 animate-fade">
                            <div className="bg-[#111318] rounded-[3rem] p-12 text-center border border-white/10 shadow-2xl win-anim">
                                <div className="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_40px_rgba(29,99,237,0.4)]">
                                    <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" strokeWidth="4" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <h2 className="text-4xl font-black italic uppercase text-white tracking-tighter">¡BRUTAL!</h2>
                                <p className="text-blue-400 text-xs font-bold uppercase tracking-[0.4em] mt-2">Nivel Superado</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
