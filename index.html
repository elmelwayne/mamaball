<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAMA BALL - Clasificador de Bolas</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #171717;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
        }

        /* Animaciones */
        @keyframes spark {
            0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(0); opacity: 0; }
        }
        .animate-spark { animation: spark 0.7s cubic-bezier(0.1, 0.5, 0.2, 1) var(--delay) forwards; }

        @keyframes capSeal {
            0% { transform: translate(-50%, -40px) scaleY(1.5); opacity: 0; }
            60% { transform: translate(-50%, 5px) scaleY(0.8); opacity: 1; }
            100% { transform: translate(-50%, 0) scaleY(1); opacity: 1; }
        }
        .animate-cap { animation: capSeal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes confetti {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: absolute; width: 10px; height: 10px; z-index: 60;
            animation: confetti 3s linear forwards;
        }

        .ball {
            border-radius: 9999px;
            position: absolute;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            background: radial-gradient(circle at 30% 30%, #ffffff 2%, var(--ball-base) 40%, var(--ball-dark) 100%);
            box-shadow: inset -1px -1px 4px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
            left: 50%;
            transform: translateX(-50%);
            width: var(--ball-size);
            height: var(--ball-size);
            bottom: calc(var(--ball-index) * var(--ball-spacing) + 0.2rem);
        }

        .ball.selected { transform: translateX(-50%) translateY(-2.5rem) scale(1.1); }

        .splash-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        @keyframes loadingBar { from { width: 0%; } to { width: 100%; } }
        .animate-loading-bar { animation: loadingBar 2s linear forwards; }

        /* Contenedor con scroll si es necesario */
        .game-scroll-area {
            flex: 1;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const BALL_COLORS = {
            red: { base: '#ff4b4b', dark: '#8b0000' },
            blue: { base: '#00bfff', dark: '#00008b' },
            yellow: { base: '#ffd700', dark: '#b8860b' },
            green: { base: '#32cd32', dark: '#006400' },
            purple: { base: '#9370db', dark: '#4b0082' },
            orange: { base: '#ff8c00', dark: '#8b4500' },
            pink: { base: '#ff69b4', dark: '#8b0a50' },
            cyan: { base: '#00ffff', dark: '#008b8b' },
        };

        const TUBE_BASE_CAPACITY = 4;

        let audioCtx = null;
        const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

        const playSound = (type) => {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;
            
            if (type === 'applause') {
                for (let i = 0; i < 12; i++) {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150 + Math.random() * 150, now + i * 0.08);
                    g.gain.setValueAtTime(0.04, now + i * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.08);
                    osc.connect(g).connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.08);
                }
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain).connect(audioCtx.destination);
                
                if (type === 'move') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(); osc.stop(now + 0.05);
                } else if (type === 'complete') {
                    // Sonido más corto
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(); osc.stop(now + 0.15);
                } else if (type === 'win') {
                    // Sonido de victoria optimizado y corto
                    osc.type = 'triangle';
                    [600, 800, 1000].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.05));
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(); osc.stop(now + 0.25);
                }
            }
        };

        const ConfettiEffect = () => {
            const colors = ['#ff0', '#f0f', '#0ff', '#0f0', '#fff'];
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-50">
                    {[...Array(40)].map((_, i) => (
                        <div key={i} className="confetti" style={{
                            left: `${Math.random() * 100}%`,
                            backgroundColor: colors[Math.floor(Math.random() * colors.length)],
                            animationDelay: `${Math.random() * 1}s`,
                            animationDuration: `${1.5 + Math.random() * 1.5}s`
                        }} />
                    ))}
                </div>
            );
        };

        const Sparks = ({ color }) => (
            <div className="absolute inset-0 pointer-events-none overflow-visible z-50">
                {[...Array(10)].map((_, i) => (
                    <div key={i} className="absolute left-1/2 top-0 w-1 h-1 rounded-full animate-spark"
                        style={{ backgroundColor: color, '--angle': `${i * 36}deg`, '--delay': '0s', '--dist': '40px' }}
                    />
                ))}
            </div>
        );

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [level, setLevel] = useState(1);
            const [tubes, setTubes] = useState([]);
            const [selectedTube, setSelectedTube] = useState(null);
            const [moves, setMoves] = useState(0);
            const [isWon, setIsWon] = useState(false);
            const [completedTubes, setCompletedTubes] = useState([]);
            const [winStreak, setWinStreak] = useState(0); 
            const [extraBottlesCount, setExtraBottlesCount] = useState(0);
            const [showApplause, setShowApplause] = useState(false);

            const capacity = TUBE_BASE_CAPACITY + Math.floor(level / 10);
            const isWide = tubes.length > 5;
            const ballSize = capacity > 5 ? '1.5rem' : (capacity > 4 ? '1.8rem' : '2.1rem');
            const ballSpacing = capacity > 5 ? '1.6rem' : (capacity > 4 ? '1.9rem' : '2.2rem');
            const tubeWidth = isWide ? 'w-10 sm:w-14' : 'w-12 sm:w-16';

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 2500);
                return () => clearTimeout(timer);
            }, []);

            const generateLevel = useCallback((lvl) => {
                const colorsCount = Math.min(2 + Math.floor((lvl - 1) / 2), 8);
                const emptyTubes = lvl > 5 ? 2 : (lvl > 2 ? 2 : 1);
                
                let currentTubes = [];
                const availableColors = Object.keys(BALL_COLORS).slice(0, colorsCount);
                
                for (let i = 0; i < colorsCount; i++) {
                    currentTubes.push(Array(capacity).fill(availableColors[i]));
                }
                for (let i = 0; i < emptyTubes; i++) {
                    currentTubes.push([]);
                }

                for (let i = 0; i < 250; i++) {
                    const sources = currentTubes.map((t, idx) => t.length > 0 ? idx : -1).filter(idx => idx !== -1);
                    const sourceIdx = sources[Math.floor(Math.random() * sources.length)];
                    const targets = currentTubes.map((t, idx) => (t.length < capacity && idx !== sourceIdx) ? idx : -1).filter(idx => idx !== -1);
                    if (targets.length === 0) continue;
                    const targetIdx = targets[Math.floor(Math.random() * targets.length)];
                    currentTubes[targetIdx].push(currentTubes[sourceIdx].pop());
                }
                return currentTubes;
            }, [capacity]);

            const startLevel = useCallback((lvl) => {
                setTubes(generateLevel(lvl));
                setSelectedTube(null);
                setMoves(0);
                setIsWon(false);
                setCompletedTubes([]);
                setShowApplause(false);
            }, [generateLevel]);

            const restartCurrentLevel = () => {
                setWinStreak(0);
                startLevel(level);
            };

            useEffect(() => { if (!showSplash) startLevel(level); }, [level, showSplash, startLevel]);

            const handleTubeClick = (tubeIndex) => {
                if (isWon || completedTubes.includes(tubeIndex)) return;
                initAudio();
                
                if (selectedTube === null) {
                    if (tubes[tubeIndex].length > 0) setSelectedTube(tubeIndex);
                } else {
                    if (selectedTube === tubeIndex) { setSelectedTube(null); return; }
                    
                    const source = tubes[selectedTube];
                    const target = tubes[tubeIndex];
                    if (target.length >= capacity) { setSelectedTube(tubeIndex); return; }

                    const color = source[source.length - 1];
                    if (target.length === 0 || target[target.length - 1] === color) {
                        let toMove = 0;
                        for (let i = source.length - 1; i >= 0; i--) {
                            if (source[i] === color && (target.length + toMove) < capacity) toMove++;
                            else break;
                        }

                        const newTubes = [...tubes];
                        const newSource = [...source];
                        const newTarget = [...target];
                        for (let i = 0; i < toMove; i++) newTarget.push(newSource.pop());
                        
                        newTubes[selectedTube] = newSource;
                        newTubes[tubeIndex] = newTarget;

                        if (newTarget.length === capacity && newTarget.every(b => b === color)) {
                            setCompletedTubes(prev => [...prev, tubeIndex]);
                            playSound('complete');
                        } else {
                            playSound('move');
                        }

                        setTubes(newTubes);
                        setMoves(m => m + 1);
                        setSelectedTube(null);

                        if (newTubes.every(t => t.length === 0 || (t.length === capacity && t.every(b => b === t[0])))) {
                            handleWin();
                        }
                    } else {
                        setSelectedTube(tubeIndex);
                    }
                }
            };

            const handleWin = () => {
                setIsWon(true);
                playSound('win');
                const nextStreak = winStreak + 1;
                setWinStreak(nextStreak);

                if (nextStreak % 5 === 0) {
                    setShowApplause(true);
                    setExtraBottlesCount(prev => prev + 1);
                    playSound('applause');
                }

                setTimeout(() => setLevel(prev => prev + 1), 2500);
            };

            const addExtraTube = () => {
                if (extraBottlesCount > 0 && !isWon) {
                    setExtraBottlesCount(prev => prev - 1);
                    setTubes(prev => [...prev, []]);
                }
            };

            if (showSplash) {
                return (
                    <div className="splash-screen">
                        <img src="mamaball.jpg" alt="MAMA BALL" className="w-64 h-64 rounded-3xl object-cover animate-pulse border-4 border-white/10" />
                        <p className="mt-6 text-white font-bold tracking-widest text-xs uppercase animate-pulse">Cargando...</p>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full bg-neutral-900 text-white flex flex-col items-center select-none overflow-hidden">
                    {showApplause && <ConfettiEffect />}
                    
                    {/* Header */}
                    <div className="w-full max-w-2xl flex justify-between items-center py-4 px-6 shrink-0">
                        <div onClick={restartCurrentLevel} className="cursor-pointer active:scale-95 transition-transform">
                            <h1 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 italic">MAMA BALL</h1>
                            <p className="text-[9px] text-neutral-500 uppercase font-bold">Nivel {level} • Racha: {winStreak}</p>
                        </div>
                        <div className="text-right">
                            <p className="text-[9px] text-neutral-500 uppercase font-black">Movimientos</p>
                            <p className="text-lg font-mono font-bold leading-none">{moves}</p>
                        </div>
                    </div>

                    {/* Tablero con Scroll Area */}
                    <div className="game-scroll-area">
                        <div className={`grid gap-x-3 gap-y-10 items-end px-4 ${tubes.length > 7 ? 'grid-cols-4 sm:grid-cols-5' : 'grid-cols-3 sm:grid-cols-4'}`}>
                            {tubes.map((tube, idx) => (
                                <div key={idx} className="relative cursor-pointer" onClick={() => handleTubeClick(idx)}>
                                    <div className={`relative ${tubeWidth} transition-all duration-300 border-x-4 border-b-4 rounded-b-2xl
                                        ${selectedTube === idx ? 'border-blue-400 bg-white/10 scale-105 shadow-lg' : 'border-white/10 bg-white/5'}
                                        ${completedTubes.includes(idx) ? 'border-green-500/30 bg-green-500/10' : ''}`}
                                        style={{ height: `calc(${capacity} * ${ballSpacing} + 1rem)` }}>
                                        
                                        {completedTubes.includes(idx) && <Sparks color={BALL_COLORS[tube[0]].base} />}
                                        {completedTubes.includes(idx) && (
                                            <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-[110%] h-4 animate-cap">
                                                <div className="w-full h-full bg-neutral-400 rounded-t-lg border-b border-black/20"></div>
                                            </div>
                                        )}
                                        
                                        <div className="relative w-full h-full">
                                            {tube.map((color, bIdx) => (
                                                <div key={bIdx} className={`ball ${selectedTube === idx && bIdx === tube.length - 1 ? 'selected' : ''}`}
                                                    style={{ 
                                                        '--ball-index': bIdx, 
                                                        '--ball-base': BALL_COLORS[color].base, 
                                                        '--ball-dark': BALL_COLORS[color].dark,
                                                        '--ball-size': ballSize,
                                                        '--ball-spacing': ballSpacing
                                                    }}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Ayuda Extra fija abajo */}
                    <div className="py-6 shrink-0 flex flex-col items-center gap-2 bg-neutral-900/80 backdrop-blur w-full border-t border-white/5">
                        <button 
                            onClick={addExtraTube}
                            disabled={extraBottlesCount === 0}
                            className={`flex items-center gap-3 px-6 py-2.5 rounded-xl transition-all ${extraBottlesCount > 0 ? 'bg-blue-600 shadow-lg active:scale-95' : 'bg-white/5 opacity-20'}`}
                        >
                            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19,2H5V5H19V2M17,6H7V8H17V6M19,9H5V22H19V9Z"/></svg>
                            <span className="font-black text-xs uppercase">Tubo Extra ({extraBottlesCount})</span>
                        </button>
                        <p className="text-[8px] text-neutral-600 font-bold uppercase tracking-widest">5 victorias sin reiniciar = +1 ayuda</p>
                    </div>

                    {/* Modal Victoria */}
                    {isWon && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-6 backdrop-blur-sm">
                            <div className="bg-neutral-800 p-8 rounded-3xl text-center shadow-2xl max-w-xs w-full border border-white/10">
                                <h2 className={`text-3xl font-black mb-2 italic ${showApplause ? 'text-yellow-400' : 'text-white'}`}>
                                    {showApplause ? '¡LEGENDARIO!' : '¡MUY BIEN!'}
                                </h2>
                                <p className="text-neutral-400 text-[10px] mb-6 uppercase tracking-widest font-bold">Nivel Completado</p>
                                
                                {showApplause && (
                                    <div className="mb-6 bg-blue-500/10 py-2 rounded-lg border border-blue-500/20">
                                        <p className="text-blue-400 text-[10px] font-black uppercase tracking-widest">+1 Tubo Extra</p>
                                    </div>
                                )}

                                <div className="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                                    <div className="h-full bg-green-500 animate-loading-bar"></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
